name: Missed sponsor
description: A video has a sponsor and Skipz did not mark it
labels: [missed-sponsor]
body:
  - type: input
    id: video
    attributes: { label: Video link, placeholder: "https://www.youtube.com/watch?v=..." }
    validations: { required: true }
  - type: input
    id: brand
    attributes: { label: Who sponsored it }
    validations: { required: true }
  - type: input
    id: when
    attributes: { label: Where the ad runs, description: "Start and end, like 4:10 to 5:35" }
  - type: textarea
    id: said
    attributes: { label: What is said or shown, description: "A line from the ad read helps most. Nothing private." }
